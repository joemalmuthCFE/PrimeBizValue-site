<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email preferences — PrimeBizValue</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FFFFFF;--surface:#F7F8FA;--border:#E6E8EC;--text:#0B0E14;--text-secondary:#5B6470;--text-muted:#8A93A0;--accent:#2454FF;--accent-bg:#EEF2FF;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;max-width:1080px;margin:0 auto;}
  .brand{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:-0.3px;text-decoration:none;color:var(--text);}
  .brand span{color:var(--accent);}
  main{max-width:560px;margin:60px auto 90px;padding:0 24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 30px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;}
  p{font-size:15px;color:var(--text-secondary);margin:0 0 14px;}
  .ok{color:#15803D;font-weight:600;}
  .warn{color:#B45309;font-weight:600;}
  a.btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px;}
  footer{text-align:center;font-size:12.5px;color:var(--text-muted);padding:20px;}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<nav><a href="/" class="brand">Prime<span>BizValue</span></a></nav>
<main>
  <div class="card" id="box">
    <h1 id="h">One moment…</h1>
    <p id="p"></p>
    <a class="btn" href="/">Back to PrimeBizValue</a>
  </div>
</main>
<footer>Questions about your data: hello@primebizvalue.com</footer>
<script>
  var s = new URLSearchParams(location.search).get('s') || 'done';
  var h = document.getElementById('h'), p = document.getElementById('p');
  if (s === 'done') {
    h.textContent = "You're unsubscribed.";
    p.innerHTML = '<span class="ok">Done.</span> No more marketing email from PrimeBizValue to this address. You may still receive a receipt or a report you purchase, because those are transactional. If you ever want back in, any form on the site will re-enroll you.';
  } else if (s === 'invalid') {
    h.textContent = "That link didn't work.";
    p.innerHTML = '<span class="warn">The unsubscribe link is missing or expired.</span> Email <a href="mailto:hello@primebizvalue.com?subject=unsubscribe">hello@primebizvalue.com</a> with the word "unsubscribe" and we\'ll handle it by hand, same day.';
  } else {
    h.textContent = 'Something went wrong on our end.';
    p.innerHTML = 'Please email <a href="mailto:hello@primebizvalue.com?subject=unsubscribe">hello@primebizvalue.com</a> and we\'ll remove you manually.';
  }
</script>
<script src="/theme.js" defer></script>
</body>
</html>
